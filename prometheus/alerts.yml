---
# Nasazuje se na CENTRÁLNÍ Prometheus, ne do agenta v tomhle stacku.
# Agent běží s --agent, což znamená žádné query API a žádná pravidla.
#
# Konvence labelů po metric_relabel_configs v prometheus.yml.template:
#   host   = stroj, ZE kterého měříme (vantage point, z HOSTNAME)
#   target = cíl pingu (8.8.8.8, www.nix.cz, ...)
#   ip     = vyresolvovaná adresa cíle
#
# Prober nemá metriku packet loss. Počítá se z rozdílu odeslaných pingů
# (smokeping_requests_total) a přijatých odpovědí
# (smokeping_response_duration_seconds_count).

groups:
  - name: smokeping
    rules:
      # Recording rules - loss a kvantily se používají na víc místech,
      # ať dashboardy i alerty koukají na tu samou definici.
      - record: smokeping:packet_loss_ratio:rate5m
        expr: |
          1 - (
              rate(smokeping_response_duration_seconds_count[5m])
            / rate(smokeping_requests_total[5m])
          )

      - record: smokeping:latency_p90:rate5m
        expr: |
          histogram_quantile(0.90,
            sum by (host, target, ip, le) (
              rate(smokeping_response_duration_seconds_bucket[5m])
            )
          )

      - record: smokeping:latency_p50:rate5m
        expr: |
          histogram_quantile(0.50,
            sum by (host, target, ip, le) (
              rate(smokeping_response_duration_seconds_bucket[5m])
            )
          )

      # --- Alerty ----------------------------------------------------------

      - alert: SmokepingPacketLoss
        expr: smokeping:packet_loss_ratio:rate5m > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: >-
            Packet loss {{ $value | humanizePercentage }} na {{ $labels.target }}
            z {{ $labels.host }}
          description: >-
            Než z tohohle uděláš stránkovací alert, ověř, že cíl nemá ICMP rate
            limit. Spousta routerů a cloud edge zařízení limituje echo reply na
            1-2/s, což při interval 1s vyrobí falešný loss.

      - alert: SmokepingTargetUnreachable
        expr: |
          rate(smokeping_response_duration_seconds_count[5m]) == 0
          and rate(smokeping_requests_total[5m]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: >-
            {{ $labels.target }} neodpovídá na ping z {{ $labels.host }}
            (pingy odchází, nic se nevrací)

      - alert: SmokepingHighLatency
        expr: smokeping:latency_p90:rate5m > 0.15
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: >-
            p90 latence {{ $value | humanizeDuration }} na {{ $labels.target }}
            z {{ $labels.host }}

      - alert: SmokepingHighJitter
        expr: |
          smokeping:latency_p90:rate5m - smokeping:latency_p50:rate5m > 0.05
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: >-
            Jitter (p90-p50) {{ $value | humanizeDuration }} na {{ $labels.target }}
            z {{ $labels.host }}
          description: >-
            Numerický ekvivalent toho, co Smokeping kreslil jako "kouř".

      - alert: SmokepingSendErrors
        expr: rate(smokeping_send_errors_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: >-
            Prober na {{ $labels.host }} nedokáže odesílat pakety
          description: >-
            Tohle je skoro vždy lokální problém, ne problém trasy: chybějící
            CAP_NET_RAW, plná odchozí fronta nebo rozbité routování.
            Zkontroluj user/cap_add v compose.

      # Agent přestal doručovat do centrálu.
      - alert: SmokepingAgentRemoteWriteFailing
        expr: |
          rate(prometheus_remote_storage_samples_failed_total{role="smokeping"}[5m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: >-
            Smokeping agent na {{ $labels.host }} neodesílá do centrálu
          description: >-
            Zkontroluj CENTRAL_PROMETHEUS_URL, basic auth a Caddy.
            WAL je na named volume, takže krátký výpadek se dožene sám.
